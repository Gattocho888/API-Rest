plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4' // (Mantén la versión que ya tienes en tu proyecto)
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco' // <-- AGREGAR ESTE PLUGIN PARA COBERTURA
}

group = 'co.edu.unbosque'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // Genera el reporte automáticamente después de correr los tests
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
    }
}